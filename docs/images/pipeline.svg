<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#05174B"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#05174B"/></marker></defs>
<rect width="940" height="400" fill="#FFFFFF"/>
<rect x="14" y="14" width="912" height="150" rx="12" fill="#EAF9FD"/>
<text x="32" y="42" font-size="13" font-weight="700" fill="#05174B">1. WHEN THE ORGANIZER UPLOADS THE PHOTOS</text>
<rect x="20.0" y="60" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="95" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Organizer</text>
<text x="95" y="102" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">picks a race and</text>
<text x="95" y="119" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">a batch of photos</text>
<rect x="207.5" y="60" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="282" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">MemoryRace client</text>
<text x="282" y="102" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">writes each file to</text>
<text x="282" y="119" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">the photo folder</text>
<rect x="395.0" y="60" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="470" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Photos table</text>
<text x="470" y="102" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">one row per photo,</text>
<text x="470" y="119" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">with its file name</text>
<rect x="582.5" y="60" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="658" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Detection script</text>
<text x="658" y="102" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">started by the client</text>
<text x="658" y="119" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">with the new photo ids</text>
<rect x="770.0" y="60" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="845" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Gemini</text>
<text x="845" y="102" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">reads the bib numbers</text>
<text x="845" y="119" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">visible on the image</text>
<line x1="174" y1="97" x2="202" y2="97" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="362" y1="97" x2="389" y2="97" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="549" y1="97" x2="576" y2="97" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="740" y1="97" x2="762" y2="97" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#b)"/>
<rect x="370.0" y="196" width="200" height="56" rx="10" fill="#EAF9FD" stroke="#18CBE9" stroke-width="1.6"/>
<text x="470" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Detections table</text>
<text x="470" y="238" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">one row per bib number found</text>
<line x1="658" y1="138" x2="540" y2="190" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20.0" y="300" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="120" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Runner</text>
<text x="120" y="342" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">picks the race,</text>
<text x="120" y="359" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">types the bib number</text>
<rect x="370.0" y="300" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="470" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">MemoryRace client</text>
<text x="470" y="342" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">one query, no detection</text>
<text x="470" y="359" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">work left to do</text>
<rect x="720.0" y="300" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#05174B" stroke-width="1.6"/>
<text x="820" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#05174B">Gallery</text>
<text x="820" y="342" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">the matching photos,</text>
<text x="820" y="359" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3C4A66">ready to download</text>
<line x1="224" y1="337" x2="364" y2="337" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="574" y1="337" x2="714" y2="337" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="400" y1="256" x2="470" y2="294" stroke="#05174B" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="20" y="284" font-size="13" font-weight="700" fill="#05174B">2. WHEN A RUNNER LOOKS FOR THEIR PHOTOS</text>
</svg>